spring:
  application:
    name: payment-service

  # ============================================================
  # DATABASE CONFIGURATION
  # ============================================================
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db
    username: root
    password: Hello@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ============================================================
  # CACHE CONFIGURATION
  # ============================================================
  cache:
    type: redis

  # ============================================================
  # REDIS CONFIGURATION
  # ============================================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8003
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.payment.service.service.paymentservice: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always