spring:
  application:
    name: api-gateway

  # ============================================================
  # CLOUD GATEWAY CONFIGURATION
  # ============================================================
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8001
          predicates:
            - Path=/api/products/**

        - id: order-service
          uri: http://localhost:8002
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8003
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://localhost:8004
          predicates:
            - Path=/api/notifications/**

  # ============================================================
  # REDIS CONFIGURATION
  # ============================================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8000
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always